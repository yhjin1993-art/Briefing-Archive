<h1>용어집</h1><div class="sub">브리핑 [오늘의 용어] 누적 79개. 매일 자동 갱신. &nbsp;<a href="./" style="color:#0f3b66;font-weight:700">브리핑 목록</a></div>
<div class="tools"><input id="q" placeholder="용어, 영문, 풀이 검색"><select id="mo"><option value="">전체 기간</option><option>2026-10</option></select><span class="n" id="cnt"></span></div>

<div class="ft">풀이는 비전공자 기준, 당사 관점은 작성 시점 의견. 정식 정의는 각 브리핑 원문과 프로젝트 glossary.md 기준.</div></div>
<script>
const R=[{"date": "2026-10-27", "id": "2026-10-27", "term": "특별위원회", "en": "Special Committee", "def": "대주주나 경영진이 거래 상대방 쪽에도 이해관계가 있을 때, 이해관계 없는 독립 이사만으로 꾸려 협상과 승인 권고를 맡기는 위원회. 별도 자문사를 쓰고, 소수주주 입장에서 가격이 공정했는지 입증하는 역할.", "note": "맥쿼리가 매각 후에도 지분을 남기거나 경영진이 재투자하면 이해상충이 생겨 같은 장치가 필요. 당사가 상장 후 매각될 때의 절차 리스크", "ex": "Surgery Partners: Bain(39%)이 매수 측에도 남아 독립 이사 특별위원회가 Moelis를 자문사로 협상"}, {"date": "2026-10-27", "id": "2026-10-27", "term": "13E-3 거래", "en": "Going-Private Transaction (Schedule 13E-3)", "def": "회사의 계열사나 대주주가 관여해 상장사를 비상장으로 만드는 거래. 미국에서는 SEC에 Schedule 13E-3을 내고 가격 산정 근거, 자문사 공정성 의견, 이해관계를 상세히 공개해야 한다.", "note": "상장 후 매각(재상폐) 시나리오에서 공시/소송 부담이 큰 구조. 국내는 공개매수 + 자진 상장폐지 요건이 대응 개념", "ex": "Surgery Partners: Bain 롤오버 때문에 13E-3 대상. 주주총회 전 위임장 설명서와 함께 제출"}, {"date": "2026-10-27", "id": "2026-10-27", "term": "자료제출의약품", "en": "Data-Submission Drug", "def": "신약도 단순 제네릭도 아닌 의약품. 새 제형, 새 함량, 새 조합(개량신약 등)처럼 생동성시험만으로는 부족해 안전성/유효성 자료 일부를 제출해 허가받는다.", "note": "Pharma사업부의 개량신약/제형 변경 품목이 해당. 2027년 수수료 인상 시 품목 포트폴리오 우선순위 재점검", "ex": "품목허가 수수료 260.9만 → 1,604.1만원(안). 신규 10품목이면 추가 비용 약 1.34억(계산치)"}, {"date": "2026-10-27", "id": "2026-10-27", "term": "자기주식 취득", "en": "Share Buyback", "def": "회사가 시장(장내) 또는 신탁 계약을 통해 자기 회사 주식을 사들이는 것. 유통 주식이 줄어 주당 가치가 올라가며, 소각까지 하면 발행주식 수 자체가 줄어든다.", "note": "상장 비교군의 주주환원 수준은 당사 IPO 시 공모가 비교 논리와 상장 후 밸류업 압력의 기준", "ex": "셀트리온 1,000억 / 514,404주 = 주당 약 19.4만원(계산치)"}, {"date": "2026-10-27", "id": "2026-10-27", "term": "필수유지업무", "en": "Essential Services (during strike)", "def": "파업 중에도 멈추면 공익이나 생명, 설비에 큰 피해가 나는 업무. 법정 유지 비율이 정해지며, 노사 합의가 안 되면 노동위원회/법원이 범위를 결정한다.", "note": "CDMO 고객 실사에서 노무 리스크와 BCP(사업연속성) 항목. 당사 동결건조/무균 공정의 유지 범위를 사전 정의", "ex": "삼성바이오: 법원이 유지 공정을 3개 → 9개로 확대(세포배양, 정제 포함)"}, {"date": "2026-10-26", "id": "2026-10-26", "term": "롤오버 지분", "en": "Rollover Equity", "def": "회사를 팔 때 기존 주주(PE, 경영진)가 지분 일부를 현금으로 받지 않고 새 인수 구조에 그대로 남겨 재투자하는 것. 매수자는 필요한 현금이 줄고, 매도자는 이후 가치 상승분을 함께 가져간다.", "note": "맥쿼리 Exit 협상 옵션. 롤오버 비율이 높을수록 회수 현금은 줄지만 매수자 풀이 넓어지고 가격을 지키기 쉽다", "ex": "Surgery Partners: Bain 약 40% 잔류(보도 기준). 지분가치 2,600억 회사에서 40% 롤오버면 1,040억은 현금 대신 지분으로 남음(가정)"}, {"date": "2026-10-26", "id": "2026-10-26", "term": "프리IPO", "en": "Pre-IPO Investment", "def": "상장 6개월~2년 전에 기관이나 PE로부터 소수지분 투자를 받는 것. 상장 예상 가치에서 할인된 가격으로 들어오고, 상장이 무산되면 상환이나 풋옵션 조건이 붙는 경우가 많다.", "note": "당사가 IPO 경로를 택하면 맥쿼리 일부 회수 또는 성장 자금 조달 수단. 상장 무산 시 조건(풋옵션, 이자)을 먼저 본다", "ex": "기업가치 1조 예상 회사에 상장가 대비 20% 할인으로 1,000억 투자 → 지분 약 12.5%(계산치)"}, {"date": "2026-10-26", "id": "2026-10-26", "term": "위임형 제네릭", "en": "Authorized Generic", "def": "오리지널 제약사가 허락해 같은 원료, 같은 공정으로 만든 제품을 다른 회사 이름으로 파는 제네릭. 국내에서는 \"쌍둥이약\"이라 부르며 위탁(수탁) 생산으로 만드는 경우가 많다.", "note": "Pharma사업부/CMO사업부 관점: 한 제품을 여러 회사 이름으로 찍어내는 구조라 수탁 물량 확보 기회. 다만 약가 개편으로 위탁 제네릭 약가는 하향 압력", "ex": "보노프라잔 제제 올해 85품목 허가(보도 기준). 1개 제조소가 10개 회사 품목을 수탁하면 1개 공정으로 10품목 매출"}, {"date": "2026-10-26", "id": "2026-10-26", "term": "급여 등재", "en": "Reimbursement Listing", "def": "의약품이 건강보험 적용 목록에 올라 환자가 일부만 내고 처방받을 수 있게 되는 것. 등재와 함께 상한 약가가 정해지며, 사실상 국내 출시 시점을 결정한다.", "note": "고객사 신제품 급여 등재 일정 = 당사 수탁 생산 물량이 실제 발생하는 시점. 수주 후 매출 인식 계획에 반영", "ex": "보신티/보노칸 다음 달 등재 예정(보도 기준). 등재 3개월 전 초도 생산 배치가 필요하다고 보면 생산 시작은 등재 일정 역산(가정)"}, {"date": "2026-10-25", "id": "2026-10-25", "term": "부분 매각", "en": "Partial Exit / Sell-down", "def": "PE가 보유 지분을 한 번에 다 팔지 않고 IPO 공모나 블록딜로 일부만 팔아 먼저 회수하는 것. 남은 지분은 주가를 보며 나중에 판다.", "note": "맥쿼리가 IPO 경로를 택하면 공모에서 일부만 회수하고 잔여 지분을 1~3년에 걸쳐 파는 구조가 현실적. 잔여분의 매각 일정이 총 회수액을 좌우", "ex": "Creador: 약 34% 보유 중 최대 14.8%p 매도(보도 기준) → 회사 지분 기준으로 보면 상장 후 약 19% 잔존(계산치, 해석에 따라 다름)"}, {"date": "2026-10-25", "id": "2026-10-25", "term": "오버행", "en": "Overhang", "def": "대주주나 PE가 아직 팔지 않은 대량 지분이 언제든 시장에 나올 수 있다는 부담. 락업 해제 시점에 주가가 눌리는 원인이 된다.", "note": "당사 IPO 후 맥쿼리 잔여 지분이 곧 오버행. 락업 기간과 블록딜 계획을 공모 전에 시장에 설명해야 공모가 할인을 줄인다", "ex": "시총 1조, PE 잔여 30%면 3,000억 물량이 대기. 하루 거래대금 30억이면 100일치"}, {"date": "2026-10-25", "id": "2026-10-25", "term": "자기자본이익률", "en": "Return on Equity, ROE", "def": "순이익을 자기자본(순자산)으로 나눈 값. 주주 돈 100원으로 1년에 얼마를 벌었는지 보여준다. PBR을 설명하는 핵심 변수.", "note": "CDMO는 공장 때문에 자본이 커서 ROE가 낮게 나오기 쉽다. 가동률 상승 = 순이익 증가 = ROE 상승 경로를 Exit 자료에 숫자로", "ex": "신일제약: ROE 5.04%(2025) → 9.16%(2029 목표). 순자산 1,000억에 순이익 50억이면 ROE 5%"}, {"date": "2026-10-25", "id": "2026-10-25", "term": "주가수익비율", "en": "Price-to-Earnings Ratio, PER", "def": "시가총액을 순이익으로 나눈 값. 시장이 1년 순이익의 몇 배를 쳐주는지. 성장 기대가 높을수록 커진다.", "note": "상장 비교군 PER은 IPO 공모가 산정의 기본 틀. 당사는 EV/EBITDA와 함께 제시", "ex": "신일제약: PER 9.66배(2025) → 35.24배(2029 목표). 순이익 100억, 시총 1,000억이면 10배"}, {"date": "2026-10-25", "id": "2026-10-25", "term": "기업가치 제고계획", "en": "Corporate Value-up Plan", "def": "상장사가 ROE, PBR, 주주환원 등 목표와 이행 계획을 스스로 공시하는 제도(밸류업 공시). 거래소가 11/2부터 업종 내 저PBR 기업 명단을 공개하며, 계획 공시 기업은 1년 유예된다.", "note": "당사가 IPO하면 상장 직후부터 이 공시 압력을 받는다. 상장 전에 목표 ROE, 배당 정책을 미리 설계", "ex": "SD바이오센서: PBR 0.32배 → 2029년 1배 목표 (보도 기준)"}, {"date": "2026-10-24", "id": "2026-10-24", "term": "구주매출", "en": "Offer for Sale, OFS", "def": "IPO 때 회사가 새 주식을 찍는 대신 기존 주주(창업자, PE)가 가진 주식을 공모로 파는 것. 돈은 파는 주주에게 가고 회사에는 들어오지 않는다.", "note": "맥쿼리가 IPO로 회수하면 공모의 상당 부분이 구주매출. 비중이 너무 크면 \"대주주 탈출\" 신호로 읽혀 공모가가 눌린다", "ex": "Paras: 공모 ₹1,450cr 중 ₹950cr(66%)가 구주매출"}, {"date": "2026-10-24", "id": "2026-10-24", "term": "청약 배수", "en": "Subscription Multiple", "def": "공모 물량 대비 몇 배의 주문이 들어왔는지. 투자자 유형별(기관, 개인)로 따로 집계하며, 기관 배수가 공모가와 상장 후 주가의 선행 지표로 쓰인다.", "note": "당사 IPO 시 기관 수요예측 배수가 공모가 밴드 상단 확정 여부를 가름", "ex": "Paras: 전체 2.34배(QIB 3.25배, 개인 2.10배). 100주 공모에 234주 주문"}, {"date": "2026-10-24", "id": "2026-10-24", "term": "앵커 투자자", "en": "Anchor Investor", "def": "일반 청약 전날 공모가로 물량을 미리 배정받는 대형 기관(국부펀드, 연기금 등). 일정 기간 매도 제한(락업)을 받는 대신 확정 배정을 받아, 다른 투자자에게 \"가격 검증\" 신호를 준다. 인도, 홍콩 IPO에 일반적.", "note": "당사 IPO에서 코너스톤/앵커 확보 여부가 공모 흥행과 맥쿼리 회수가격을 좌우", "ex": "Paras: 앵커 ₹652.5cr = 전체 공모의 약 45%(계산치)"}, {"date": "2026-10-24", "id": "2026-10-24", "term": "역모리스 트러스트", "en": "Reverse Morris Trust, RMT", "def": "모회사가 사업부를 분리해 다른 회사와 합치되, 모회사 주주가 합병 회사 지분 50% 초과를 갖게 해 미국 세법상 양도세 없이 사업부를 넘기는 구조. 상대 회사가 현금을 일부 얹어 주기도 한다.", "note": "대기업 사업부(공장) 카브아웃 시 매각 대신 결합 구조가 나오는 이유. 매수자 입장에선 현금 부담을 줄이는 대안", "ex": "J&J/S&N 안: J&J 주주 50.1% + S&N이 약 $10B 현금 지급 (RMT 유사 구조, 보도 기준)"}, {"date": "2026-10-24", "id": "2026-10-24", "term": "주가순자산비율", "en": "Price-to-Book Ratio, PBR", "def": "시가총액을 장부상 순자산(자본총계)으로 나눈 값. 1배 미만이면 시장이 회사를 \"청산 가치보다 낮게\" 본다는 뜻. ROE가 낮거나 이익 지속성이 의심될 때 낮아진다.", "note": "자산(공장)이 많은 CDMO는 PBR과 EV/EBITDA를 함께 봐야 함. 국내 밸류업 공시의 핵심 지표", "ex": "제일파마홀딩스: PBR 0.39배 = 순자산 1만원을 시장이 3,900원으로 평가"}, {"date": "2026-10-23", "id": "2026-10-23", "term": "사업결합계약", "en": "Business Combination Agreement (BCA)", "def": "공개매수 전에 매수자와 대상회사 이사회가 맺는 계약. 이사회의 지지와 추천, 매수 후 경영 약속(브랜드, R&D, 고용), 경쟁 제안 대응 방식, 일정을 미리 정한다. 공개매수가 \"적대적\"이 아니라 \"추천형\"이 되는 근거 문서.", "note": "맥쿼리 Exit이 상장사 매각 형태면 매수자가 당사 이사회에 먼저 요구하는 문서. 당사가 상장사를 살 때는 BCA 확보가 성사 확률의 핵심", "ex": "Qiagen: 10/21 BCA 체결 → 양 이사회 만장일치 추천 → 주주에게 €46.50 응모 권고"}, {"date": "2026-10-23", "id": "2026-10-23", "term": "최소 응모 조건", "en": "Minimum Acceptance Threshold", "def": "공개매수에서 \"이 비율 이상 응모가 안 되면 거래를 접는다\"는 하한. 매수자가 경영권(50%+1주)이나 스퀴즈아웃 가능 비율(75~95%)을 확보 못 한 채 소수지분만 떠안는 위험을 막는다. 낮게 잡을수록 성사 확률은 높지만 100% 확보까지 추가 단계가 필요하다.", "note": "상장사 인수 검토 시 최소 응모 비율과 그 뒤 100%까지 가는 비용, 기간을 함께 산정", "ex": "Qiagen: 50%+1주. 발행주식 약 2.1억주(가정)면 약 1.06억주 응모가 조건"}, {"date": "2026-10-23", "id": "2026-10-23", "term": "상장폐지 인수", "en": "Take-private (Public-to-Private, P2P)", "def": "PE가 상장사 주식 전부를 사서 비상장으로 만드는 거래. 분기 실적 압박 없이 구조조정, 투자, 재매각(Exit)을 준비할 수 있다. 공개매수 + 스퀴즈아웃, 또는 합병 방식으로 진행하고 보통 인수금융(LBO)을 쓴다.", "note": "맥쿼리의 당사 Exit이 IPO로 가면, 몇 년 뒤 다른 PE가 당사를 다시 Take-private 하는 경로도 Exit 시나리오에 포함", "ex": "Qiagen: 시가총액 약 $10.3B 상장사를 EV €10.8B에 PE가 인수, FSE와 NYSE 동시 상장폐지"}, {"date": "2026-10-23", "id": "2026-10-23", "term": "공동투자", "en": "Co-investment", "def": "PE 펀드가 큰 딜을 할 때 펀드 LP(국부펀드, 연기금 등)가 펀드 밖에서 같은 딜에 직접 추가로 돈을 넣는 것. 펀드는 한 건 집중 한도를 지키면서 대형 딜을 할 수 있고, LP는 운용보수 없이 지분을 얻는다.", "note": "당사 매각 시 입찰 PE가 \"공동투자자 확보\"를 조건으로 걸면 자금 확약(에쿼티 커밋먼트) 주체가 둘 이상이 되어 확인 대상이 늘어난다", "ex": "Qiagen: EQT XI 펀드 + ADIA(Luxinva) + CPP Investments가 에쿼티를 나눠 출자, 비율 비공개"}, {"date": "2026-10-23", "id": "2026-10-23", "term": "충당금", "en": "Provision", "def": "아직 돈이 나가진 않았지만 소송, 반품, 보증처럼 미래에 지출할 가능성이 높고 금액을 추정할 수 있을 때 미리 비용으로 잡아 부채로 쌓는 것. 그 분기 영업이익을 깎지만 실제 현금은 나중에 나간다.", "note": "고객사 실적에서 충당금이 크면 영업이익은 눌려도 현금흐름은 멀쩡할 수 있음. 실사에서는 충당금 내역(약가 소송, 반품)을 따로 본다", "ex": "보령: 카나브 약가소송 충당금 반영 후 9개월 영업이익 694억, 영업이익률 8.2%. 충당금이 50억(가정)이면 반영 전 744억"}, {"date": "2026-10-22", "id": "2026-10-22", "term": "신기술사업투자조합", "en": "New Technology Business Investment Fund", "def": "여신전문금융업법에 따라 신기술금융사, 증권사 등이 결성하는 조합형 펀드. PE(사모집합투자기구)보다 결성이 빠르고 상장사 소수지분, CB 투자에 자주 쓰인다. 운용사(GP)가 둘 이상 공동 운용하기도 한다.", "note": "국내 PE가 당사 같은 중견기업에 소수지분, 메자닌으로 들어올 때 쓰는 그릇. 투자자 실체(GP, LP)를 확인할 때 조합 형태부터 본다", "ex": "포인터스PE + LF인베스트먼트가 메드테크1호 조합으로 리메드에 150억(구주 50억 + CB 100억) 투자"}, {"date": "2026-10-22", "id": "2026-10-22", "term": "구주 매입", "en": "Secondary Share Purchase (구주 vs 신주)", "def": "이미 발행된 주식을 기존 주주에게서 사는 것. 돈은 파는 주주에게 가고 회사에는 들어오지 않는다. 반대로 신주(유상증자, CB 전환)는 회사에 돈이 들어가지만 기존 주주 지분이 희석된다.", "note": "맥쿼리 Exit은 전액 구주 거래. 매수자가 \"구주 일부 + 신주\"를 섞자고 하면 회수액이 줄어드는 대신 회사 자금이 생기므로 둘의 비율이 협상 포인트", "ex": "구주 50억 = 50만주(주가 10,000원 가정) → 창업자 지분 30%가 25%로, 회사 자본금은 그대로"}, {"date": "2026-10-22", "id": "2026-10-22", "term": "출자전환", "en": "Debt-to-Equity Swap", "def": "빌린 돈(채권)을 갚는 대신 그 금액만큼 주식을 발행해 채권자에게 주는 것. 회사는 빚이 줄고 자본이 늘지만, 채권자가 주주가 되고 기존 주주 지분은 희석된다. 회생 절차에서 변제 수단으로 흔하다.", "note": "거래 상대방(고객사, 인수 대상)이 출자전환을 겪었다면 부채 구조와 주주 구성이 바뀐 뒤이므로 실사 시 전후 재무제표를 따로 본다", "ex": "한국유니온제약: 회생채권 약 1.8억(계산치)을 365,003주(발행가 500원)로 전환, 현금 납입 없음"}, {"date": "2026-10-22", "id": "2026-10-22", "term": "램프업", "en": "Ramp-up", "def": "새 공장이나 라인이 완공된 뒤 가동률을 단계적으로 올리는 구간. 검증(밸리데이션) 배치, 인증용 배치가 먼저 나가고 상업 생산이 뒤따르므로, 이 기간엔 비용은 먼저 들고 매출은 늦게 잡힌다.", "note": "동결건조 라인 증설 시 완공 후 램프업 기간(통상 1~2년)의 고정비 부담을 투자 회수 계산에 넣어야 한다. Exit 자료에서는 램프업 완료 시점의 가동률을 보여주는 것이 핵심", "ex": "삼성바이오로직스 5공장: 하반기 인증용 배치 매출 인식 → 1~4공장 풀가동과 합쳐 연간 가이던스 20%"}, {"date": "2026-10-22", "id": "2026-10-22", "term": "포트폴리오 간 거래", "en": "Portco-to-Portco Transaction", "def": "같은 PE 운용사가 보유한 두 회사 사이에서 사업부나 자산을 사고파는 거래. 사업을 재배치해 각 회사를 단순하게(퓨어플레이) 만들지만, 매도자와 매수자의 주인이 같아 가격 공정성(펀드 LP 간 이해상충)을 제3자 평가로 입증해야 한다.", "note": "맥쿼리가 다른 포트폴리오사와 당사 사이에 사업 이전을 제안할 수 있는 구조. 가격 근거(독립 평가)와 LP 승인 절차를 확인", "ex": "Astorg 보유 Oxoid Remel이 같은 Astorg 보유 Solabia의 미생물 진단 사업부를 인수, 금액 비공개"}, {"date": "2026-10-21", "id": "2026-10-21", "term": "CVR", "en": "Contingent Value Right, 조건부 가치권", "def": "상장사 인수 시 주주에게 현금과 함께 나눠주는 \"조건 달성 시 추가로 돈 받을 권리\". 매출, EBITDA, 허가 같은 목표를 연도별로 걸고, 달성하면 주당 정해진 금액을 지급한다. 보통 양도 불가. 어닝아웃을 상장사 주주용으로 표준화한 형태.", "note": "당사 Exit에서 매수자가 \"확정 대금 + 실적 조건부\"를 제안할 때 등장. 목표 지표(매출/EBITDA)와 측정 기준을 매도자가 유리하게 정의하는 것이 핵심", "ex": "Lifecore 주주는 현금 $6.28 + CVR(2028 $0.67, 2029 $0.94, 2030 $1.78) → 전부 달성 시 $9.67"}, {"date": "2026-10-21", "id": "2026-10-21", "term": "Go-shop 조항", "en": "Go-shop Provision", "def": "인수 계약에 서명한 뒤에도 일정 기간(보통 30~45일) 매도자가 다른 매수 후보를 적극 찾아볼 수 있게 허용하는 조항. 더 좋은 제안이 오면 낮은 위약금만 내고 갈아탈 수 있다. 경쟁 입찰 없이 한 곳과 계약했을 때 \"싸게 판 게 아니다\"를 증명하는 장치.", "note": "맥쿼리가 수의계약으로 당사를 팔 경우 이사회 책임 방어용으로 들어갈 수 있는 조항. 반대로 당사가 사는 입장이면 Go-shop 기간의 재입찰 리스크 계산", "ex": "Lifecore 30일 Go-shop. 위약금이 거래가의 1%(약 $4M, 가정)면 $4M 이상 높은 제안이 올 때만 갈아탈 유인"}, {"date": "2026-10-21", "id": "2026-10-21", "term": "기준일", "en": "Record Date", "def": "주주총회 의결권이나 배당을 받을 주주를 \"이 날 장 마감 시점 주주명부 기준\"으로 확정하는 날짜. 기준일 뒤에 산 주주는 그 주총에서 투표할 수 없다. M&A에서는 기준일 확정이 곧 주총 일정과 종결 일정의 출발점.", "note": "상장사 인수 시 일정표의 첫 체크포인트. 기준일 → 위임장 발송 → 주총 → 규제 승인 → 종결 순서로 자금 집행 시점을 역산", "ex": "Lifecore 기준일 11/4 → 주총은 통상 4~6주 뒤(12월 초, 추정) → 4분기 종결 목표와 맞물림"}, {"date": "2026-10-21", "id": "2026-10-21", "term": "PIK 배당", "en": "Payment-in-Kind Dividend", "def": "우선주나 채권의 이자, 배당을 현금 대신 같은 증권을 더 주는 방식으로 쌓아두는 것. 회사는 현금이 안 나가지만 투자자의 원금이 매년 불어나, 나중에 상환하거나 M&A로 정산할 때 금액이 커진다.", "note": "PE가 투자한 회사의 우선주, 메자닌에 흔한 조건. 당사 Exit 시 맥쿼리 인수 구조에 PIK성 증권이 있다면 누적액이 분배 순서에서 먼저 빠짐", "ex": "Lifecore Series A 전환금액 $50.2M(2026-06-30)에 연 7.5% PIK 누적 → 종결까지 6개월이면 약 $1.9M 추가(계산치)"}, {"date": "2026-10-21", "id": "2026-10-21", "term": "커밋먼트 레터", "en": "Equity / Debt Commitment Letter", "def": "인수 계약 서명 시 매수자가 \"돈은 확실히 있다\"를 증명하는 확약서. 에쿼티 커밋먼트는 PE 펀드가 자기 자본 투입을, 데트 커밋먼트는 은행, 사모대출이 대출 실행을 약속한다. 매도자는 이 두 장이 있어야 \"자금조달 실패로 깨질 위험\"을 걱정하지 않는다.", "note": "당사 매각 시 입찰자의 커밋먼트 레터 유무, 대주단 구성이 \"진짜 살 수 있는 후보\"를 가리는 기준. 고객사가 대주단에 들어오는 Lifecore 사례는 특이 케이스", "ex": "Lifecore: 에쿼티(Webster 펀드) + 데트(MidCap, MSD Partners, Alcon) 커밋먼트로 인수대금과 비용 전액 커버"}, {"date": "2026-10-20", "id": "2026-10-20", "term": "인수 프리미엄", "en": "Takeover Premium (Control Premium)", "def": "인수 제안가가 발표 직전 주가보다 몇 % 높은지. 경영권을 통째로 가져가는 대가와 매수자가 보는 시너지, 입찰 경쟁이 녹아 있다. 높을수록 \"비싸게 샀다\"는 뜻이지만, 직전 주가가 눌려 있었으면 숫자가 과장된다.", "note": "당사 Exit이 상장 후 매각 형태라면 매수자가 지불할 프리미엄이 맥쿼리 회수액을 좌우. 비상장 매각에서는 동종 딜 멀티플로 대체", "ex": "직전 주가 $8.70(계산치), 제안가 $20 → ($20 - $8.70) / $8.70 = 130%"}, {"date": "2026-10-20", "id": "2026-10-20", "term": "순현금", "en": "Net Cash", "def": "보유 현금에서 차입금을 뺀 값이 플러스일 때. 지분가치에서 순현금을 빼면 EV(기업가치)가 나온다. 매수자는 인수 후 이 현금을 그대로 쓸 수 있어 \"사실상 돌려받는 돈\"으로 본다.", "note": "당사는 설비투자로 차입이 있어 순차입금 구조. 매각 시 지분가치 = EV - 순차입금이므로 차입 축소가 곧 지분가치 증가", "ex": "지분가치 $1.3B - EV $1.1B = 순현금 $0.2B(계산치)"}, {"date": "2026-10-20", "id": "2026-10-20", "term": "찬성 확약", "en": "Irrevocable Undertaking", "def": "주요 주주가 \"주주총회에서 이 딜에 찬성하겠다\"고 계약 전에 서면으로 약속하는 것. 매수자는 승인 불확실성을 줄이고, 더 높은 경쟁 제안이 와도 철회하기 어렵게 만든다. 영국, 유럽 상장사 M&A에 일반적.", "note": "해외 상장사 인수 검토 시 대주주 확약 확보가 성사 확률의 핵심. 당사 Exit에서는 맥쿼리 지분이 곧 확약 역할", "ex": "Silence 지분 14% 보유 주주가 서명. 승인 요건이 75%라면 61%p를 더 모으면 통과"}, {"date": "2026-10-20", "id": "2026-10-20", "term": "경쟁 매각 절차", "en": "Competitive Sale Process (Auction)", "def": "매도자가 여러 매수 후보에게 동시에 자료를 주고 입찰을 받는 매각 방식. 1차 예비입찰 → 실사 → 본입찰 순으로 좁히며, 후보 간 경쟁이 가격을 올린다. 반대는 한 곳과만 협상하는 수의계약(Bilateral).", "note": "맥쿼리의 당사 매각도 경쟁 입찰이 기본. 입찰에 들어올 후보(글로벌 PE, 전략 매수자) 수가 가격을 결정", "ex": "후보 6곳 접촉 → 예비입찰 4곳 → 본입찰 2곳 → 최고가 $20/주 선정(가정)"}, {"date": "2026-10-20", "id": "2026-10-20", "term": "Exit 준비", "en": "Exit Readiness", "def": "PE가 회사를 팔기 18~24개월 전부터 실적 개선 과제, 가격 체계, 고객 구조, 성장 스토리를 정리해 \"팔릴 수 있는 상태\"로 만드는 작업. 매각 직전 포장이 아니라 실제 숫자로 보여줄 시간을 확보하는 것이 핵심.", "note": "맥쿼리 보유 5년차 시점에서 당사가 지금 착수해야 할 항목. 단가 거버넌스, 가동률, 수주 잔고 가시화가 대상", "ex": "18개월 전 착수, 가격 통제로 매출 +2%, EBITDA +5% → EBITDA 400억이면 420억, 멀티플 10배 시 EV +200억"}, {"date": "2026-10-19", "id": "2026-10-19", "term": "자산양수도", "en": "Asset Transfer / Asset Purchase", "def": "회사 주식이 아니라 토지, 건물, 설비 같은 자산 자체를 사고파는 것. 주식양수도와 달리 부채, 소송 등 숨은 책임이 따라오지 않아 깔끔하지만, 인허가, 고용은 다시 받아야 할 수 있다. 자산총액 10% 이상이면 주요사항보고서 공시.", "note": "공장 인수 검토 시 주식 vs 자산 인수 구조 선택", "ex": "안국약품 과천 사옥 1,630억 = 연결 총자산 3,109억의 52.4% → 주요사항보고서 제출"}, {"date": "2026-10-19", "id": "2026-10-19", "term": "브라운필드 인수", "en": "Brownfield Acquisition", "def": "이미 지어져 가동 중인 공장을 사는 것. 땅부터 새로 짓는 그린필드(Greenfield)보다 빠르고 인허가 리스크가 적지만, 설비가 낡았거나 내 공정에 안 맞을 수 있다. Anuh Pharma가 Tarapur 공장을 산 논리.", "note": "동결건조 라인 증설 시 신축 vs 인수 비교", "ex": "Anuh Pharma가 Rs 72.9 crore에 Tarapur 가동 공장 인수, 신축 2~3년 대비 수개월 내 가동(가정)"}, {"date": "2026-10-19", "id": "2026-10-19", "term": "합병비율", "en": "Merger Ratio", "def": "두 회사가 합칠 때 없어지는 회사 주식 1주를 남는 회사 주식 몇 주로 바꿔주는지 정한 비율. 비율이 유리하면 그쪽 주주가 합병 후 지분을 더 갖는다. 차헬스케어, 차케어스 합병에서 오너 개인 지분이 쟁점인 이유.", "note": "Exit 시 합병형 거래 구조 이해", "ex": "차케어스 1주 = 차헬스케어 0.5주(가정)면 차케어스 100만주 보유 주주는 합병 후 50만주"}, {"date": "2026-10-19", "id": "2026-10-19", "term": "잉여현금흐름", "en": "FCF, Free Cash Flow", "def": "영업에서 번 현금(영업현금흐름)에서 설비투자(Capex)를 빼고 실제로 남는 돈. 배당, 차입 상환, M&A에 쓸 수 있는 \"진짜 여유 현금\". 투자가 많은 해엔 흑자여도 FCF가 마이너스가 된다.", "note": "설비투자 판단과 PE 매수자의 핵심 지표", "ex": "OCF 450억(가정, 상반기 227억 × 2) - Capex 281.5억(가정) = FCF 168.5억"}, {"date": "2026-10-19", "id": "2026-10-19", "term": "Capex 집약도", "en": "Capex Intensity", "def": "매출 대비 설비투자 비율. 안국약품은 올해 투자 결정 2,115억 / 2025 매출 3,069억 = 69%. 높을수록 성장 투자 국면이지만 FCF가 줄고 차입이 늘어난다. 제약, CDMO는 공장 때문에 구조적으로 높다.", "note": "당사 증설 규모가 적정한지 보는 잣대", "ex": "안국약품 투자 결정 2,114.8억 ÷ 2025 매출 3,069억 = 68.9%, 올해 현금 집행 기준은 약 9%(가정)"}, {"date": "2026-10-18", "id": "2026-10-18", "term": "뉴코", "en": "NewCo (Newly Formed Company)", "def": "특정 자산(라이선스한 약물 권리 등)을 담기 위해 새로 세운 회사. PE·VC가 자본을 대고 경영진을 영입해 임상을 진행한 뒤 IPO나 매각으로 회수한다. 공장이 없어 생산은 전량 외주.", "note": "PE NewCo = 당사 잠재 고객. IPO 회수 사례는 맥쿼리 Exit 참고", "ex": "Bain이 $400M 규모 초기 펀딩으로 세운 Hercules, 항서 후보 3개를 받아 2년 뒤 시총 $1.4B로 상장"}, {"date": "2026-10-18", "id": "2026-10-18", "term": "지분 결합 라이선싱", "en": "License-for-Equity", "def": "약물 권리를 넘기는 대가로 현금 대신(또는 현금에 더해) 상대 회사 지분을 받는 계약. 상대가 성공하면 지분 가치로 추가 이익을 얻지만, 실패하면 휴지가 된다.", "note": "Pharma사업부 품목·제형 기술 라이선스 아웃 시 조건 옵션", "ex": "항서가 현금 대신 받은 Hercules 지분 20%, Kailera 시총 $1.4B 기준 약 $280M(가정 계산)"}, {"date": "2026-10-18", "id": "2026-10-18", "term": "바이오벅스", "en": "Biobucks (Headline Deal Value)", "def": "업프론트에 개발·허가·판매 마일스톤을 모두 더한 계약 총액. 대부분이 조건부라 실제 수령액과 차이가 크다. 기사 헤드라인 금액은 대개 이것.", "note": "고객사 \"○조 기술수출\" 보도 시 업프론트 비중부터 확인", "ex": "항서-Hercules 총액 $6B 중 업프론트 5.7% 가정 시 $342M, 나머지 $5,658M은 조건부"}, {"date": "2026-10-18", "id": "2026-10-18", "term": "추가 응모기간", "en": "Additional Acceptance Period", "def": "공개매수 1차 기간에 최소 조건이 충족되면, 응모하지 않은 주주에게 같은 가격으로 다시 주는 2차 응모 기간. 스위스·EU 공개매수에 일반적.", "note": "해외 상장사 인수 시 일정·자금 집행 시점 산정", "ex": "폴리펩타이드 1차 응모율 87.88% 확정 후 10/19~30 미응모 주주에게 같은 가격으로 2차 기회"}, {"date": "2026-10-18", "id": "2026-10-18", "term": "불성실공시법인", "en": "Unfaithful Disclosure Corporation", "def": "거래소가 공시 번복·지연·누락을 한 상장사에 붙이는 지정. 벌점 누적 시 매매정지·관리종목 지정까지 간다.", "note": "거래 상대방·고객사 실사 시 공시 이력 체크 항목", "ex": "대화제약, 공급계약 해지 공시 번복과 2023년 사안의 지연 공시로 지정 예고, 결정 11/4"}, {"date": "2026-10-17", "id": "2026-10-17", "term": "브릿지론", "en": "Bridge Loan", "def": "본 조달(장기 인수금융, 증자)이 들어오기 전 짧게 쓰는 단기 대출. 공개매수처럼 돈이 먼저 필요할 때 증권사가 빌려주고, 나중에 장기 대출로 바꾼다(차환). 금리가 높다.", "note": "Exit 시 인수자의 초기 자금 조달 수단. 브릿지론 → 차환 일정이 인수자 자금력의 신호", "ex": "2024.9 고려아연 공개매수용 1조 7,150억(NH투자증권) → 2025.5 전액 상환 후 장기 대출로 전환"}, {"date": "2026-10-17", "id": "2026-10-17", "term": "리파이낸싱", "en": "Refinancing, 차환", "def": "기존 빚을 새 빚으로 갈아타는 것. 금리/만기/대주를 바꾸거나 브릿지론을 장기 대출로 전환한다. 갚은 날 같은 금액을 다시 빌리면 실질 상환이 아니다.", "note": "맥쿼리 인수금융 리파이낸싱 뉴스 = 대주주 자금 사정과 Exit 시점의 신호", "ex": "브릿지론 상환일(2025.5)에 6,000억 1차 차환, 2026.4 6,000억 2차 차환으로 같은 자금이 유지됨"}, {"date": "2026-10-17", "id": "2026-10-17", "term": "중복상장", "en": "Parent-Subsidiary Dual Listing", "def": "모회사와 자회사가 모두 증시에 상장하는 것. 자회사 가치가 모회사 주가에서 빠져나가 모회사 주주가 손해를 본다는 논란으로, 당국이 주주 보호와 경영 독립성을 심사한다.", "note": "IPO Exit 설계 시 사업부 분할 상장의 제약 조건", "ex": "상장사 엘앤씨바이오가 CRO 자회사 GMRC IPO 진행 중, 지분 67.14% 자회사 리씨엠바이오도 상장 준비 논란"}, {"date": "2026-10-17", "id": "2026-10-17", "term": "보유기간", "en": "Holding Period", "def": "PE가 회사를 사서 팔 때까지의 기간. 같은 회수배수(MOIC)라도 기간이 길어지면 연환산 수익률(IRR)이 떨어지므로, 보유기간이 길어질수록 매각 압력이 커진다.", "note": "당사 보유기간(2020년 인수 기준) = 맥쿼리 Exit 압력의 1차 지표", "ex": "MOIC 2.0x 동일 조건에서 보유 4년이면 IRR 18.9%, 5.5년(+38%)이면 13.4%, 7년이면 10.4%"}, {"date": "2026-10-17", "id": "2026-10-17", "term": "빈티지", "en": "Vintage Year", "def": "펀드가 결성되거나 첫 투자를 집행한 연도. 같은 빈티지 펀드끼리 성과를 비교하며, 특정 빈티지에 산 자산들은 비슷한 시기에 Exit 시장에 나온다.", "note": "2020~2022 빈티지 CDMO가 Exit 대기열. 당사와 동시 매물 가능성", "ex": "2020 빈티지(맥쿼리 2020년 당사 인수)는 2026년 보유 6년차, 2020~22 빈티지 CDMO와 동시에 Exit 대기"}, {"date": "2026-10-16", "id": "2026-10-16", "term": "출자약정", "en": "Capital Commitment", "def": "LP(투자자)가 펀드에 넣기로 약속한 총액. 결성 시 한 번에 내지 않고 투자 건이 생길 때마다 나눠 납입한다. 펀드 규모 $3B = 약정 합계.", "note": "Exit 매수자의 '실탄' 크기를 읽는 기준", "ex": "OrbiMed 아시아 펀드 $1B = LP 약정 합계, 결성일에 실제 납입된 돈은 거의 없다"}, {"date": "2026-10-16", "id": "2026-10-16", "term": "캐피탈 콜", "en": "Capital Call", "def": "GP가 LP에게 '약정한 돈 중 얼마를 지금 보내라'고 요청하는 것. 딜이 확정되면 발생.", "note": "PE가 당사 인수 자금을 마련하는 실제 절차", "ex": "약정 $1B 펀드가 $150M 딜 확정 시 LP 전체에 $150M 납입 요청, 약정의 15% 소진"}, {"date": "2026-10-16", "id": "2026-10-16", "term": "GP / LP", "en": "General Partner / Limited Partner", "def": "GP는 펀드를 운용하고 책임지는 운용사(OrbiMed, 맥쿼리), LP는 돈을 대고 운용에는 관여하지 않는 투자자(연기금·보험 등).", "note": "맥쿼리 = GP, 그 뒤의 LP 만기가 Exit 시점에 영향", "ex": "OrbiMed(GP)가 $3B 운용, 연기금 등 LP 출자. 관리보수 2%면 연 $60M (가정)"}, {"date": "2026-10-16", "id": "2026-10-16", "term": "주요사항보고서", "en": "Report on Material Facts", "def": "상장사가 자산 양수도, 증자, 합병 등 회사에 중대한 결정을 하면 다음 날까지 내야 하는 공시. 유형자산 양수는 자산총액 10% 이상이면 대상.", "note": "당사 설비투자도 규모가 크면 같은 기준으로 외부에 공개", "ex": "안국약품 1,630억 양수 = 자산총액의 52.42%, 기준 10% 초과로 이사회 당일 제출"}, {"date": "2026-10-16", "id": "2026-10-16", "term": "선매입", "en": "Forward Purchase (Pre-completion Purchase)", "def": "아직 짓지 않은 건물을 계약금·중도금을 내고 미리 사두는 것. 준공 후 잔금 정산으로 가격이 바뀔 수 있다.", "note": "안국약품 1,630억이 이 구조. 투자 시점과 자금 유출 시점이 다름", "ex": "안국약품 계약금 81.5억(5%) 10/29 납입, 중도금 2회, 잔금은 2032.6 준공 후 정산"}, {"date": "2026-10-15", "id": "2026-10-15", "term": "트레이드 세일", "en": "Trade Sale, 전략적 매수자 매각", "def": "PE가 보유 회사를 다른 PE가 아니라 같은 업종의 사업회사(전략적 매수자)에 파는 것. 시너지를 보는 매수자라 가격이 높게 나오기 쉽다. 오늘 ZO Skin Health 사례.", "note": "맥쿼리 Exit 시나리오 중 하나. 국내외 CDMO·제약사가 매수자 후보", "ex": "Blackstone이 ZO를 다른 PE가 아닌 Galderma에 EV $1.5B 전액 현금으로 매각, 6년 보유 후 매출 2배 성장분을 회수"}, {"date": "2026-10-15", "id": "2026-10-15", "term": "EV/Sales 멀티플", "en": "EV/Revenue Multiple", "def": "기업가치(EV)가 연매출의 몇 배인지. 이익이 아직 작거나 변동이 큰 회사의 가격을 비교할 때 쓴다. ZO: $1.5B / $330M = 약 4.5배(계산치).", "note": "이익이 설비 감가상각에 눌린 CDMO 밸류 비교 보조지표", "ex": "ZO EV $1,500M ÷ LTM 매출 $330M = 4.5배. 당사 매출 2,000억에 3.0배를 적용하면 EV 6,000억(가정)"}, {"date": "2026-10-15", "id": "2026-10-15", "term": "볼트온 인수", "en": "Bolt-on Acquisition", "def": "이미 가진 회사에 작은 회사를 \"볼트로 붙이듯\" 덧붙이는 인수. 플랫폼 회사의 매출·역량을 키워 Exit 가치를 높이는 PE 단골 전략. Lonza가 매각 대금으로 하겠다고 한 것.", "note": "당사가 PE 보유 중 소형 주사제 CDMO를 인수하면 볼트온", "ex": "Lonza가 캡슐 매각 대금 $3B 중 일부로 매출 $200M 소형 CDMO를 사서 기존 사업에 붙이면 볼트온(가정)"}, {"date": "2026-10-15", "id": "2026-10-15", "term": "퓨어플레이", "en": "Pure-play", "def": "한 가지 사업만 하는 회사. 투자자가 사업을 이해하기 쉽고 동종 비교가 쉬워 멀티플 평가에 유리하다. Lonza가 캡슐사업을 팔아 CDMO 퓨어플레이가 되는 이유.", "note": "당사는 이미 CDMO 퓨어플레이 → 비교군이 명확", "ex": "Lonza가 캡슐사업을 $3B에 떼어내면 남는 매출 100%가 CDMO, 비교군이 CDMO 3~4사로 좁혀져 멀티플 설명이 단순해짐"}, {"date": "2026-10-15", "id": "2026-10-15", "term": "EPS 중립/희석", "en": "EPS Neutral / Accretive / Dilutive", "def": "인수 후 매수자의 주당순이익(EPS)이 그대로(중립)인지, 늘어나는지(증가), 줄어드는지(희석). 상장 매수자가 주주에게 인수를 설명하는 기준.", "note": "상장사가 당사를 인수할 경우 매수자 EPS 영향이 가격 상한", "ex": "Galderma EPS 10.0(가정)에서 인수 후 이자 비용과 ZO 이익이 상쇄되어 10.0 유지면 중립, 9.5로 내려가면 희석"}, {"date": "2026-10-14", "id": "2026-10-14", "term": "공개매수", "en": "Tender Offer", "def": "상장사 주식을 장내 매매가 아닌 \"정해진 가격/기간\"으로 모든 주주에게서 사들이겠다고 공개 제안하는 것. 경영권 인수나 상장폐지 전 단계로 쓰임. 오늘: 삼성바이오로직스가 폴리펩타이드 주주에게 CHF 44.31 제안.", "note": "당사 Exit가 상장사 매각/IPO 후 매각 형태라면 인수자가 쓰는 도구", "ex": "폴리펩타이드 3,301만주에 주당 CHF 44.31 제안, 100% 응모 시 CHF 1.46B(약 2.7조)"}, {"date": "2026-10-14", "id": "2026-10-14", "term": "스퀴즈아웃", "en": "Squeeze-out", "def": "대주주가 법정 비율(스위스 90%/98%, 한국 95%) 이상 확보하면 남은 소수주주 지분을 강제로 사들여 100%로 만드는 절차. 응모하지 않은 주주를 정리해 상장폐지/완전 자회사화를 끝냄.", "note": "상장사 인수 시 \"100%까지 드는 추가 비용/기간\" 산정 요소", "ex": "87.92% 확보 후 98%까지 333만주를 더 사야 하고, 추가 비용은 CHF 1.48억(약 2,730억)"}, {"date": "2026-10-14", "id": "2026-10-14", "term": "특수목적법인", "en": "SPC, Special Purpose Company", "def": "특정 거래(인수, 자금조달)만을 위해 세운 서류상 회사. 인수 대상 지분과 빚을 모회사와 분리해 담는 그릇. 오늘: 삼성펩타이드.", "note": "맥쿼리의 당사 인수도 SPC 구조. 인수금융은 보통 SPC가 빌림", "ex": "삼성펩타이드가 공개매수 주체가 되어 폴리펩타이드 지분 87.92%와 인수 자금을 보유"}, {"date": "2026-10-14", "id": "2026-10-14", "term": "신종자본증권", "en": "Hybrid Capital Securities", "def": "만기 30년 이상 또는 영구이고 이자 지급을 미룰 수 있어 회계/감독상 \"자본\"으로 인정되는 채권. 금융사가 자본비율을 지키면서 돈을 모을 때 발행. 오늘: 신한금융이 롯데손보 인수 재원 8,000억 조달.", "note": "인수자의 자금조달 여력(돈이 어디서 나오나) 판단 시 확인", "ex": "신한금융이 3월/9월 각 4,000억, 총 8,000억 발행해 롯데손보 인수 6,933억의 재원으로 활용"}, {"date": "2026-10-14", "id": "2026-10-14", "term": "적기시정조치", "en": "Prompt Corrective Action", "def": "금융사의 건전성 지표가 기준에 미달하면 감독당국이 단계별(권고→요구→명령)로 내리는 시정 명령. 받으면 증자/자산 매각 등을 강제. 오늘: 롯데손보 2단계(경영개선요구) → 인수자 증자 부담이 매각가에 반영.", "note": "규제 부담이 \"가격 할인 요인\"이 되는 사례. 제약은 GMP 적합판정 취소 등이 유사 역할", "ex": "롯데손보 경영개선요구 단계 → 인수 후 증자 수천억(가정)이 필요해 매각가 6,933억에 반영"}, {"date": "2026-10-13", "id": "2026-10-13", "term": "세무 효과 반영 순인수가", "en": "Net Purchase Price after Tax Benefits", "def": "인수 구조에 따라 매수자가 앞으로 세금을 덜 내게 되는 금액(현재가치)을 헤드라인 가격에서 뺀 값. STERIS는 $2.1B 가격에서 $300M을 빼 $1.8B라고 설명했다.", "note": "매수자가 \"비싸게 산 게 아니다\"라고 말할 때 쓰는 논리. 당사 매각 시 매수자가 제시할 수 있는 가격 근거", "ex": "헤드라인 $2.1B에서 세금 절감 NPV $300M을 빼면 $1.8B, 매출 $245M 기준 8.6x가 7.3x로 내려간다"}, {"date": "2026-10-13", "id": "2026-10-13", "term": "잠정실적", "en": "Preliminary Earnings", "def": "회계감사 전에 회사가 먼저 공시하는 분기/연간 실적. 확정 수치와 조금 다를 수 있다. 셀트리온이 3분기 매출 1.5조를 이 형식으로 공개했다.", "note": "고객사/경쟁사 실적을 가장 먼저 보는 창", "ex": "셀트리온 3분기 잠정 매출 1.5조, 영업이익 5,100억, 확정치는 11월 분기보고서에서 소폭 달라질 수 있다"}, {"date": "2026-10-13", "id": "2026-10-13", "term": "의무공개매수", "en": "Mandatory Tender Offer", "def": "상장사 지분을 일정 비율 넘게 사면 나머지 주주에게도 같은 조건으로 사겠다고 제안해야 하는 의무. 베트남 타세코 주주들은 소지츠에 이 의무를 면제해줬다. 한국도 2027년 도입 논의 중.", "note": "PE가 상장사를 사거나 PE 보유 상장사를 팔 때 인수 비용을 바꾸는 규제", "ex": "한국 도입 논의안: 25% 초과 취득 시 50%+1주까지 같은 가격으로 공개매수 의무(논의안 기준)"}, {"date": "2026-10-13", "id": "2026-10-13", "term": "기업결합 심사", "en": "Merger Review", "def": "일정 규모 이상의 M&A는 공정거래위원회가 경쟁 제한 여부를 심사해 승인해야 거래를 끝낼 수 있다. 프리미어/삼영 딜은 신고 완료, 승인 대기 상태.", "note": "SPA 서명과 잔금(클로징) 사이의 필수 관문. 딜 일정의 변수", "ex": "삼영 1,000억 딜: 공정위 신고 후 기본 심사 30일(최대 120일 연장), 승인 시 11월 잔금 지급(보도)"}, {"date": "2026-10-13", "id": "2026-10-13", "term": "SI / FI", "en": "Strategic Investor / Financial Investor", "def": "SI는 사업 시너지를 위해 사는 기업, FI는 수익을 내고 되팔기 위해 투자하는 PE 등 금융 투자자. 스틱(FI)이 소지츠(SI)에게 판 것이 전형.", "note": "PE Exit의 두 갈래: SI에 매각 vs 다른 FI에 매각(세컨더리)", "ex": "스틱(FI) 2019년 2,840억 동 투자 → 2026년 소지츠(SI)에 3,810억 동 매각, 7년 +34%(동화 기준)"}, {"date": "2026-10-12", "id": "2026-10-12", "term": "풋옵션", "en": "Put Option", "def": "정해진 조건이 되면 내 지분을 상대에게 정해진 가격(또는 산식)에 팔 수 있는 권리. 시지바이오 매도자는 3년 내 실적 달성 시 잔여 49%를 최대 2배 가치로 팔 권리를 요구.", "note": "매각 후 업사이드 공유 장치. Exit 구조 설계 시 매수자 저항 요인", "ex": "기업가치 1.2조 × 잔여 49% = 5,880억, 3년 내 실적 달성 시 2배인 1조 1,760억에 매도 가능(가정)"}, {"date": "2026-10-12", "id": "2026-10-12", "term": "경업금지 조항", "en": "Non-compete Clause", "def": "매도자(또는 경영진)가 회사를 판 뒤 일정 기간 같은 사업을 하지 않기로 하는 약속. 범위·기간이 넓을수록 매수자에게 유리.", "note": "IMM PE 결렬 사유. 대주주·경영진 Exit 시 사전 정리 항목", "ex": "기간 3년, 범위 국내 동종 사업 전체(가정)면 매도자 재창업이 막혀 조건 이견으로 협상 결렬 가능"}, {"date": "2026-10-12", "id": "2026-10-12", "term": "단계적 매각", "en": "Staged Sale / Deferred Acquisition", "def": "지분을 한 번에 다 팔지 않고 1차(경영권) + 2차(잔여)로 나눠 파는 것. 2차 가격을 실적에 연동하면 어닝아웃과 비슷해진다.", "note": "맥쿼리 부분 Exit 시나리오의 한 형태", "ex": "1.2조 기준 51%(6,120억) 먼저 매각, 49%(5,880억)는 3년 내 실적 연동 산식으로 2차 매각"}, {"date": "2026-10-12", "id": "2026-10-12", "term": "일괄 인수", "en": "One-shot Acquisition", "def": "경영권 지분(예: 70%)을 처음부터 한 번에 사는 것. 매수자는 지배권 불확실성과 2차 협상 비용을 피할 수 있다.", "note": "매수 PE의 기본 선호. 매도자 조건과 충돌 지점", "ex": "1.2조 기준 70% 원샷이면 8,400억을 한 번에 지급하고 2차 협상 없이 지배권 확보"}, {"date": "2026-10-12", "id": "2026-10-12", "term": "확정 지급액", "en": "Firm Value (vs Contingent)", "def": "계약 체결 시 받기로 확정된 금액(업프론트 등). 마일스톤·로열티 같은 조건부 금액과 구분. 아태 Top10 라이선스 7건은 최대 금액의 8.3%만 확정.", "note": "보도 총액의 할인 기준", "ex": "총액 $1B 라이선스에서 업프론트 $83M만 확정이면 확정 비중 8.3%, 나머지 $917M은 조건부"}];const q=document.getElementById('q'),mo=document.getElementById('mo'),box=document.getElementById('list'),cnt=document.getElementById('cnt');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){const k=q.value.trim().toLowerCase(),m=mo.value;const rows=R.filter(r=>(!m||r.date.startsWith(m))&&(!k||[r.term,r.en,r.def,r.note,r.ex].join(' ').toLowerCase().includes(k)));
cnt.textContent=rows.length+'개 (누적 '+R.length+'개)';
box.innerHTML=rows.length?rows.map(r=>'<div class="tr"><div class="dt">'+esc(r.date)+'</div><div><div class="k">'+esc(r.term)+(r.en?'<span>'+esc(r.en)+'</span>':'')+'<a class="go" href="b/'+encodeURIComponent(r.id)+'/">브리핑</a></div>'+(r.def?'<div class="df">'+esc(r.def)+'</div>':'')+(r.note?'<div class="nt">당사 관점: '+esc(r.note)+'</div>':'')+(r.ex?'<div class="ex">예: '+esc(r.ex)+'</div>':'')+'</div></div>').join(''):'<div class="tr"><div></div><div style="color:#9ca3af">조건에 맞는 용어가 없습니다.</div></div>'}
q.addEventListener('input',render);mo.addEventListener('change',render);render();
</script></body></html>
